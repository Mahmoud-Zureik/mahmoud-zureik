<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الموقع قيد التحديث | محمود زريق</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background: #f8fafc;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .content {
      max-width: 700px;
      padding: 30px 20px;
      animation: show 0.8s ease;
    }

    .icon {
      width: 85px;
      height: 85px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #eef2ff;
      color: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    .small-title {
      color: #6366f1;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 65px);
      line-height: 1.2;
      margin-bottom: 20px;
    }

    h1 span {
      color: #6366f1;
    }

    .description {
      color: #6b7280;
      font-size: 18px;
      line-height: 1.9;
      margin-bottom: 30px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 30px;
      background: #f1f5f9;
      color: #374151;
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #6366f1;
      animation: pulse 1.5s infinite;
    }

    @keyframes show {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.7);
      }
    }

    @media (max-width: 600px) {

      .description {
        font-size: 16px;
      }

      .icon {
        width: 70px;
        height: 70px;
        font-size: 30px;
      }

      h1 {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <main class="content">

    <div class="icon">
      ⚙️
    </div>

    <div class="small-title">
      Mahmoud Zureik
    </div>

    <h1>
      الموقع <span>قيد التحديث</span>
    </h1>

    <p class="description">
      أعمل حالياً على تطوير وتحسين الموقع
      <br>
      لتقديم تجربة أفضل وتصميم أكثر احترافية.
      <br>
      سأعود إليك قريباً بإصدار جديد.
    </p>

    <div class="status">
      <span class="dot"></span>
      جاري العمل على الموقع
    </div>

  </main>

</body>

</html>
